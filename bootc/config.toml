# bootc-image-builder config for the installer ISO (anaconda-iso).
# Users go in the kickstart: bib won't combine [[customizations.user]] with a kickstart.
[customizations.installer.kickstart]
contents = """
text --non-interactive
# Whole-disk install on the mini PC's NVMe. WIPES IT.
zerombr
clearpart --all --initlabel --disklabel=gpt
# Explicit parts: autopart caps / at 70 GiB even with --nohome, stranding the rest of the disk.
reqpart --add-boot
part / --fstype=ext4 --grow
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=homelab
timezone America/New_York --utc
rootpw --lock
user --name=homelab --groups=wheel
sshkey --username=homelab "ssh-rsa  redonxharja@pop-os"
reboot --eject

# The ISO installs the locally built image; track ghcr so bootc upgrade gets CI builds.
%post
bootc switch --mutate-in-place --transport registry ghcr.io/rxharja/homelab-os:latest
%end
"""
