name: build

on:
  push:
    branches: [main, testing]
  pull_request:
  schedule:
    - cron: "17 5 * * 6"   # weekly rebuild picks up Fedora + package updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  caddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: caddy-cloudflare
          tags: ${{ github.ref_name == 'main' && 'latest' || 'testing' }} ${{ github.sha }}
          context: images/caddy
          containerfiles: images/caddy/Containerfile
      - if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  os:
    needs: caddy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -S warning rootfs/usr/bin/homelab-* scripts/export-devbox.sh
      - name: Lint quadlets
        run: |
          sudo apt-get install -y podman
          QUADLET_UNIT_DIRS=$PWD/rootfs/usr/share/containers/systemd /usr/libexec/podman/quadlet -dryrun >/dev/null
          ! grep -nE '^Environment=[^"]* ' rootfs/usr/share/containers/systemd/*.container
      - uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: homelab-os
          tags: ${{ github.ref_name == 'main' && 'latest' || 'testing' }} ${{ github.sha }}
          containerfiles: Containerfile
          build-args: |
            IMAGE_OWNER=${{ github.repository_owner }}
      - if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
