# Every directory the host units and container volumes mount.

d /etc/homelab                              0750 root root -

d /var/lib/homelab                          0755 root root -
d /var/lib/homelab/config                   0750 root root -
d /var/lib/homelab/config/riven             0750 root root -
d /var/lib/homelab/config/paperless-gpt     0750 root root -
d /var/lib/homelab/config/pocket-id         0750 root root -
d /var/lib/homelab/config/open-webui        0750 root root -
d /var/lib/homelab/config/tinyauth          0750 root root -
d /var/lib/homelab/config/paperless         0750 root root -
d /var/lib/homelab/config/zurg              0750 root root -

d /var/lib/homelab/appdata                  0755 root root -
d /var/lib/homelab/appdata/actual           0755 root root -
d /var/lib/homelab/appdata/_dumps           0700 root root -
d /var/lib/homelab/appdata/adguard          0755 root root -
d /var/lib/homelab/appdata/adguard/work     0755 root root -
d /var/lib/homelab/appdata/adguard/conf     0755 root root -
d /var/lib/homelab/appdata/caddy            0755 root root -
d /var/lib/homelab/appdata/caddy/data       0755 root root -
d /var/lib/homelab/appdata/caddy/config     0755 root root -
d /var/lib/homelab/appdata/jellyfin         0755 root root -
d /var/lib/homelab/appdata/jellyfin/config  0755 root root -
d /var/lib/homelab/appdata/jellyfin/cache   0755 root root -
d /var/lib/homelab/appdata/ollama           0755 root root -
d /var/lib/homelab/appdata/open-webui       0755 root root -
d /var/lib/homelab/appdata/paperless          0755 root root -
d /var/lib/homelab/appdata/paperless/db       0755 root root -
d /var/lib/homelab/appdata/paperless/redis    0755 root root -
d /var/lib/homelab/appdata/paperless/data     0755 root root -
d /var/lib/homelab/appdata/paperless/media    0755 root root -
d /var/lib/homelab/appdata/paperless/consume  0755 root root -
d /var/lib/homelab/appdata/paperless/export   0755 root root -
d /var/lib/homelab/appdata/paperless-gpt          0755 root root -
d /var/lib/homelab/appdata/paperless-gpt/prompts  0755 root root -
d /var/lib/homelab/appdata/paperless-gpt/config   0755 root root -
d /var/lib/homelab/appdata/paperless-gpt/db       0755 root root -
d /var/lib/homelab/appdata/pocket-id        0755 root root -
d /var/lib/homelab/appdata/riven            0755 root root -
d /var/lib/homelab/appdata/riven/db         0755 root root -
d /var/lib/homelab/appdata/riven/redis      0755 root root -

# Riven runs as UID 1000 with no user namespace, so :U never re-chowns these.
d /var/lib/homelab/appdata/riven/data       0755 1000 1000 -
d /var/lib/homelab/appdata/riven/logs       0755 1000 1000 -
d /var/lib/homelab/appdata/seerr            0755 root root -
d /var/lib/homelab/appdata/tinyauth         0755 root root -
d /var/lib/homelab/appdata/zurg             0755 root root -
d /var/lib/homelab/appdata/zurg/data        0755 root root -

d /var/mnt/media                            0755 root root -
# RivenVFS will not mount on a path it does not own.
d /var/mnt/media/riven                      0755 1000 1000 -
d /var/mnt/media/zurg                       0755 root root -

d /var/cache/homelab                        0755 root root -
d /var/cache/homelab/rclone                 0755 root root -
